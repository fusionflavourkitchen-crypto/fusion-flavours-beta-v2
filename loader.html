<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Flavours</title>
</head>
<body>
<script>
(async function(){
  const res=await fetch('/index.html?source='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('Could not load Fusion Flavours app');
  let html=await res.text();

  html=html.replaceAll('Pouches / units available','Units available');

  /* Make Fusion at Home a real top-level Owner area before rendering. */
  const serviceOwnerButton='<button data-area="service" onclick="showOwnerArea(\'service\')">Service</button>';
  const fusionHomeOwnerButton='<button data-area="fusionhome" onclick="showOwnerArea(\'fusionhome\')">Fusion at Home</button>';
  html=html.replace(serviceOwnerButton,fusionHomeOwnerButton+'\n'+serviceOwnerButton);

  /* The retail patch used to push Fusion at Home back inside Kitchen. Replace that at source. */
  html=html.replace(
    "if(!OWNER_AREAS.kitchen.some(x=>x[0]==='fusionhome'))OWNER_AREAS.kitchen.push(['fusionhome','Fusion at Home']);",
    "OWNER_AREAS.kitchen=OWNER_AREAS.kitchen.filter(x=>x[0]!=='fusionhome');OWNER_AREAS.fusionhome=[['fusionhome','Fusion at Home']];"
  );

  /* Give the new top-level area the correct display label. */
  html=html.replace(
    "catering:'Catering',harnell:'Harnell',service:'Service'",
    "catering:'Catering',harnell:'Harnell',fusionhome:'Fusion at Home',service:'Service'"
  );

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>Fusion Flavours</h2><p>The app could not load. Please refresh.</p></div>';
  console.error(err);
});
</script>
</body>
</html>
