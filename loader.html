<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Flavours</title>
</head>
<body>
<script>
(async function(){
  const res=await fetch('/index.html?source='+Date.now(),{cache:'no-store'});
  if(!res.ok) throw new Error('Could not load Fusion Flavours app');
  let html=await res.text();

  html=html.replaceAll('Pouches / units available','Units available');

  /* Permanently reshape the Owner menu in the HTML that is about to run. */
  const serviceButton='<button data-area="service" onclick="showOwnerArea(\'service\')">Service</button>';
  const fusionButton='<button data-area="fusionhome" onclick="showOwnerArea(\'fusionhome\')">Fusion at Home</button>';
  html=html.replace(/<button data-area="fusionhome"[^>]*>Fusion at Home<\/button>\s*/g,'');
  html=html.replace(serviceButton,fusionButton+'\n'+serviceButton);

  /* Remove every known version that puts Fusion at Home inside Kitchen. */
  html=html.replace(/if\(!OWNER_AREAS\.kitchen\.some\(x=>x\[0\]==='fusionhome'\)\)OWNER_AREAS\.kitchen\.push\(\['fusionhome','Fusion at Home'\]\);/g,
    "OWNER_AREAS.kitchen=OWNER_AREAS.kitchen.filter(x=>x[0]!=='fusionhome');OWNER_AREAS.fusionhome=[['fusionhome','Fusion at Home']];");

  /* Ensure the top-level area exists even if the source changes later. */
  html=html.replace(
    "service:[['service','Service']]",
    "fusionhome:[['fusionhome','Fusion at Home']],\n  service:[['service','Service']]"
  );
  html=html.replace(
    "catering:'Catering',harnell:'Harnell',service:'Service'",
    "catering:'Catering',harnell:'Harnell',fusionhome:'Fusion at Home',service:'Service'"
  );

  /* Final runtime guard: runs after the whole app has loaded and wins over later patches. */
  const guard=`<script>
(function(){
  function hideAllTopLevel(){
    ['welcomeHub','customer','retailCustomer','cateringCustomer','harnellCustomer','legalCustomer','owner'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.classList.add('hidden');
    });
  }

  function goOwner(){
    try{
      document.getElementById('headerMenu')?.classList.add('hidden');
      hideAllTopLevel();
      var owner=document.getElementById('owner');
      if(owner) owner.classList.remove('hidden');
      var u=new URL(location.href);
      u.search='';
      u.searchParams.set('view','owner');
      history.replaceState({view:'owner'},'',u);
      if(typeof token!=='undefined' && token && typeof openOwner==='function') openOwner();
      window.scrollTo(0,0);
    }catch(e){console.error('Owner navigation',e);}
  }

  function goHome(){
    try{
      document.getElementById('ownerNavMenu')?.classList.add('hidden');
      hideAllTopLevel();
      var welcome=document.getElementById('welcomeHub');
      if(welcome) welcome.classList.remove('hidden');
      if(typeof renderWelcomeHub==='function') renderWelcomeHub();
      var u=new URL(location.href);
      u.search='';
      u.searchParams.set('view','home');
      history.replaceState({view:'home'},'',u);
      window.scrollTo(0,0);
    }catch(e){console.error('Customer view navigation',e);}
  }

  function forceFusionHomeTopLevel(){
    try{
      if(typeof OWNER_AREAS!=='undefined'){
        if(Array.isArray(OWNER_AREAS.kitchen)) OWNER_AREAS.kitchen=OWNER_AREAS.kitchen.filter(function(x){return x[0]!=='fusionhome';});
        OWNER_AREAS.fusionhome=[['fusionhome','Fusion at Home']];
      }
      var menu=document.getElementById('ownerNavMenu');
      if(menu){
        menu.querySelectorAll('button[data-area="fusionhome"]').forEach(function(b){b.remove();});
        var b=document.createElement('button');
        b.type='button';
        b.setAttribute('data-area','fusionhome');
        b.textContent='Fusion at Home';
        b.onclick=function(e){
          e.preventDefault();
          forceFusionHomeTopLevel();
          menu.classList.add('hidden');
          if(typeof showOwnerArea==='function') showOwnerArea('fusionhome');
          else if(typeof showTab==='function') showTab('fusionhome');
        };
        var service=menu.querySelector('button[data-area="service"]');
        if(service) menu.insertBefore(b,service); else menu.appendChild(b);
      }
    }catch(e){console.error('Fusion at Home nav guard',e);}
  }

  /* Delegated capture handlers survive any later menu rebuilds. */
  document.addEventListener('click',function(e){
    var ownerEntry=e.target.closest && e.target.closest('#ownerEntry');
    if(ownerEntry){
      e.preventDefault();
      e.stopImmediatePropagation();
      goOwner();
      return;
    }
    var customerBtn=e.target.closest && e.target.closest('#customerBtn');
    if(customerBtn){
      e.preventDefault();
      e.stopImmediatePropagation();
      goHome();
    }
  },true);

  window.goFusionOwner=goOwner;
  window.goFusionHome=goHome;

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',forceFusionHomeTopLevel); else forceFusionHomeTopLevel();
  setTimeout(forceFusionHomeTopLevel,100);
  setTimeout(forceFusionHomeTopLevel,500);
  setTimeout(forceFusionHomeTopLevel,1500);
})();
<\/script>`;
  html=html.replace('</body>',guard+'\n</body>');

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h2>Fusion Flavours</h2><p>The app could not load. Please refresh.</p></div>';
  console.error(err);
});
</script>
</body>
</html>
