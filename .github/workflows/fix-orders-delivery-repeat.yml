name: Fix repeating delivery settings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-orders-delivery-repeat.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch duplicate settings guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('orders-delivery-integration.js')
          s=p.read_text()
          old="if(!$('ffDeliverySettings')){const h=p.querySelector('h2');if(h)h.insertAdjacentHTML('afterend',settingsHtml())}"
          new="if(!p.querySelector('.ffDeliverySettings')){const h=p.querySelector('h2');if(h)h.insertAdjacentHTML('afterend',settingsHtml())}"
          if old not in s:
              raise SystemExit('target guard not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "Fusion Flavours Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add orders-delivery-integration.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix repeating delivery settings on Orders"
          git push
