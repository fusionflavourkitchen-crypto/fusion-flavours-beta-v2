name: Apply Fusion update via issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[run] latest Fusion update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          special_css='''<style>
.welcomeRouteCard.route-fusionhome{
  background:linear-gradient(145deg,#171717,#28211d)!important;
  color:#fff!important;
  border:1px solid var(--o)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.18)!important;
}
.welcomeRouteCard.route-fusionhome p{color:#eadfd7!important}
</style>'''
          s=s.replace(special_css,'')

          old_card="return `<a class=\"welcomeRouteCard route-${esc(safeRoute)}\" href=\"${esc(routeUrl(x.route))}\"><div class=\"welcomeRouteIcon\">${esc(x.icon||'🔥')}</div><h2>${esc(x.title)}</h2><p>${esc(x.subtitle||'')}</p></a>`"
          new_card="return `<a class=\"welcomeRouteCard route-${esc(safeRoute)}\" href=\"${esc(routeUrl(x.route))}\"><div class=\"welcomeRouteIcon\">${esc(x.icon||'🔥')}</div><h2>${esc(x.title)}</h2><p>${esc(x.route==='fusionhome'?'Fusion Flavours products delivered by post.':(x.subtitle||''))}</p></a>`"
          s=s.replace(old_card,new_card)

          blend_panel="${String(i.name).toLowerCase().includes('blend')?`<div class=\"retailIngredients\"><b>Ingredients:</b> ${RETAIL_INGREDIENTS}<br><b>Net weight:</b> 100g</div>`:''}"
          s=s.replace(blend_panel,'')
          s=s.replace('Pouches / units available','Units available')

          marker='/* ===== FINAL OWNER NAV FIX 2026-08-23 ===== */'
          if marker not in s:
              patch='''
<script>
/* ===== FINAL OWNER NAV FIX 2026-08-23 ===== */
(function(){
  function setupFinalOwnerNav(){
    const entry=document.getElementById('ownerEntry');
    const toggle=document.getElementById('ownerNavToggle');
    const menu=document.getElementById('ownerNavMenu');
    if(entry){
      entry.onclick=function(e){
        e.preventDefault();e.stopPropagation();
        document.getElementById('headerMenu')?.classList.add('hidden');
        ['welcomeHub','customer','retailCustomer','cateringCustomer','harnellCustomer','legalCustomer'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
        document.getElementById('owner')?.classList.remove('hidden');
        const u=new URL(location.href);u.search='';u.searchParams.set('view','owner');history.pushState({view:'owner'},'',u);
        if(typeof token!=='undefined' && token && typeof openOwner==='function')openOwner();
      };
    }
    if(toggle&&menu){
      toggle.onclick=function(e){e.preventDefault();e.stopPropagation();menu.classList.toggle('hidden');};
      menu.querySelectorAll('button[data-area]').forEach(btn=>{
        btn.onclick=function(e){e.preventDefault();e.stopPropagation();menu.classList.add('hidden');if(typeof showOwnerArea==='function')showOwnerArea(btn.dataset.area);};
      });
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setupFinalOwnerNav);else setupFinalOwnerNav();
})();
</script>
'''
              s=s.replace('</body>',patch+'\n</body>')

          if s==original:
              raise SystemExit('No changes were applied.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "Fusion Flavours Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Apply latest Fusion at Home and owner dashboard update"
          git push
