name: Fix Community Meals delivery text
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-community-delivery-text.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Harnell delivery SMS wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='Fusion Flavours: your Harnell House order is outside. Please come to the agreed collection point / entrance.'
          new='Fusion Flavours: your Community Meals order is outside. Please come to the agreed delivery point / entrance.'
          if old not in s:
              raise SystemExit('delivery SMS wording not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit delivery text fix
        run: |
          git config user.name "Fusion Flavours Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix Community Meals delivery text"
          git push
