name: Install unified Orders delivery loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add unified Orders delivery script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/orders-delivery-integration.js?v=20260828c"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no closing body tag')
              text = text.replace('</body>', tag + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
      - name: Commit loader if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Loader already installed"
            exit 0
          fi
          git config user.name "Fusion Flavours Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Unify Orders and Delivery controls"
          git push origin main
