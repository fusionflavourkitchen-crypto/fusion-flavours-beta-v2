name: Audit main ordering code
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-main-ordering.yml'
permissions:
  contents: write
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean source-of-truth labels and preorder remnants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('owner-router.js'); s=p.read_text()
          s=s.replace("['harnellorders', 'Harnell Orders']","['harnellorders', 'Community Orders']")
          s=s.replace("harnell: { label: 'Harnell', tabs: [['harnell', 'Harnell']] },","harnell: { label: 'Community Meals', tabs: [['harnell', 'Community Meals']] },")
          s=re.sub(r"^\s*delivery: \{ label: 'Delivery'.*$",'',s,flags=re.M)
          p.write_text(s)
          p=Path('fusion-runtime.js'); s=p.read_text()
          s=s.replace('Catering, Harnell, Legal','Catering, Community Meals, Legal').replace('Could not load Harnell menu:','Could not load Community Meals:')
          p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          new_dashboard='''function renderDashboard(){const o=paidToday(),rev=o.reduce((n,x)=>n+Number(x.total_pence||0),0)/100,out=o.filter(x=>![\'delivered\',\'cancelled\'].includes(x.order_status)).length,port=o.reduce((n,x)=>n+(x.order_items||[]).reduce((m,y)=>m+Number(y.quantity||0),0),0);$(\'page-dash\').innerHTML=`<div class="stats"><div class="stat">${o.length}<small>Paid orders today</small></div><div class="stat">${money(rev)}<small>Revenue today</small></div><div class="stat">${out}<small>Outstanding</small></div><div class="stat">${port}<small>Portions today</small></div></div><div class="panel"><h2>Main Delivery</h2><p>Normal ordering is active. Customers can order available menu items directly.</p></div><div class="panel" id="revenuePanel"></div>`;renderRevenue()}'''
          s,n=re.subn(r'function renderDashboard\(\)\{.*?\}\nfunction renderRevenue',new_dashboard+'\nfunction renderRevenue',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dashboard patch failed')
          new_service='''function renderService(){const s=ownerData.settings;$(\'page-service\').innerHTML=`<div class="panel"><h2>Main Delivery settings</h2><div class="notice"><b>Normal ordering</b><br>Main Delivery accepts normal orders. Community Meals keeps its separate preorder and delivery-slot system.</div><label>Main customer headline<textarea id="fHero">${esc(s.hero_text||\'Fresh, honest food delivered to your door.\')}</textarea></label><label>Customer announcement<textarea id="fNotice">${esc(s.notice||\'\')}</textarea></label><label>Delivery areas<textarea id="fAreas">${esc(s.delivery_areas||\'\')}</textarea></label><div class="split"><label>Delivery charge<input id="fFee" type="number" step=".5" value="${Number(s.delivery_fee_pence||0)/100}"></label><label>Minimum food order<input id="fMin" type="number" step=".5" value="${Number(s.minimum_order_pence||0)/100}"></label></div><button style="width:100%;margin-top:12px" onclick="saveService()">Save service settings</button></div>`}'''
          s,n=re.subn(r'function renderService\(\)\{.*?\}\nwindow\.saveService=async',new_service+'\nwindow.saveService=async',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('base service patch failed')
          new_save='''window.saveService=async()=>{try{const body={hero_text:$(\'fHero\').value.trim()||\'Fresh, honest food delivered to your door.\',notice:$(\'fNotice\').value,delivery_areas:$(\'fAreas\').value.trim()||\'Local delivery area coming soon\',delivery_fee_pence:Math.round(Number($(\'fFee\').value||0)*100),minimum_order_pence:Math.round(Number($(\'fMin\').value||0)*100)};await api(\'/rest/v1/settings?id=eq.1\',{method:\'PATCH\',headers:{Prefer:\'return=minimal\'},body:JSON.stringify(body)});ownerData.settings={...ownerData.settings,...body};state.settings=ownerData.settings;await loadCustomer();renderService();alert(\'Service settings saved\')}catch(e){alert(e.message)}}'''
          s,n=re.subn(r'window\.saveService=async\(\)=>\{.*?\}\nfunction renderPrep',new_save+'\nfunction renderPrep',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('save service patch failed')
          s=s.replace("<details class=\"ownerDrop\"><summary><span>Service controls</span><span>${s.preorder_open?'Open':'Closed'} ▾</span></summary><div class=\"ownerDropBody\">","<details class=\"ownerDrop\"><summary><span>Main Delivery controls</span><span>Settings ▾</span></summary><div class=\"ownerDropBody\"><div class=\"notice\"><b>Normal ordering</b><br>Main Delivery accepts normal orders. Community Meals keeps its separate preorder and delivery-slot system.</div>")
          for pattern in [r'^.*Preorders open</label>\s*$',r'^.*Order cutoff<input.*fCut.*$',r'^.*Delivery from<input.*fFrom.*$',r'^.*Max orders<input.*fMaxO.*$',r'^.*Regular opening days.*$']:
              s=re.sub(pattern,'',s,flags=re.M)
          s=re.sub(r'\.preorderBox\{[^}]*\}\.preorderBox strong\{[^}]*\}','',s)
          s=re.sub(r'\.preorderBox\{[^}]*\}','',s)
          for term in ['PREORDER TODAY','Preorders Open','Preorders open','Order slots left']:
              if term in s: raise SystemExit('legacy main-order wording remains: '+term)
          if 'id=\\"fCut\\"' in s or 'id=\\"fOpen\\"' in s or 'id=\\"fFrom\\"' in s or 'id=\\"fMaxO\\"' in s:
              raise SystemExit('legacy main-order controls remain')
          p.write_text(s)
          p=Path('api/app.js'); s=p.read_text(); s=re.sub(r"const BUILD = '[^']+';","const BUILD = '20260828-refactor-34';",s,count=1); p.write_text(s)
          PY
      - name: Syntax-check JavaScript
        run: |
          set -e
          for f in *.js api/*.js api/lib/*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
      - name: Verify key integration files
        run: |
          grep -q "label: 'Community Meals'" owner-router.js
          grep -q "Community Orders" owner-router.js
          ! grep -q "delivery: { label: 'Delivery'" owner-router.js
          grep -q "function serviceOpen(){return true}" index.html
          ! grep -q "PREORDER TODAY" index.html
          ! grep -q "Preorders open" index.html
          ! grep -q "Order slots left" index.html
          ! grep -q 'id=\\"fCut\\"' index.html
          ! grep -q 'id=\\"fOpen\\"' index.html
          grep -q "20260828-refactor-34" api/app.js
      - name: Commit audit fixes
        run: |
          git config user.name "Fusion Flavours Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add owner-router.js fusion-runtime.js index.html api/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Complete main ordering and Community Meals cleanup"
          git pull --rebase origin main
          git push
