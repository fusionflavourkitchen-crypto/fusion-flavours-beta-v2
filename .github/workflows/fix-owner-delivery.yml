name: Fix owner delivery

on:
  push:
    paths:
      - '.github/workflows/fix-owner-delivery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        env:
          HOTFIX_B64: 
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='FF_OWNER_DELIVERY_HOTFIX_20260828'
          if marker not in s:
              hotfix=base64.b64decode(os.environ['HOTFIX_B64']).decode('utf-8')
              if '</body>' not in s:
                  raise SystemExit('index.html has no closing body tag')
              s=s.replace('</body>',hotfix+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('Patched index.html')
          else:
              print('Hotfix already present')
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Fusion Flavours Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Owner route and add Delivery management tab'
          git push
