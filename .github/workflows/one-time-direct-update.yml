name: One-time controlled Fusion Flavours update

on:
  push:
    branches: [main]
    paths:
      - '.run-one-time-update-v2'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted index update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Fusion at Home card: use the same styling as the other welcome cards.
          s = re.sub(
              r'\n<style>\s*\.welcomeRouteCard\.route-fusionhome\{.*?\.welcomeRouteCard\.route-fusionhome p\{.*?\}\s*</style>\s*',
              '\n', s, flags=re.S
          )

          # Fusion at Home welcome-card wording: products only, no seasonings wording.
          old = "<p>${esc(x.subtitle||'')}</p>"
          new = "<p>${esc(x.route==='fusionhome'?'Fusion Flavours products delivered by post.':(x.subtitle||''))}</p>"
          if old in s:
              s = s.replace(old, new, 1)

          # Remove the old spice-blend-specific ingredients/net-weight block from postal products.
          s = re.sub(
              r"\$\{String\(i\.name\)\.toLowerCase\(\)\.includes\('blend'\)\?`<div class=\"retailIngredients\">.*?</div>`:''\}",
              '', s, flags=re.S
          )
          s = s.replace('Pouches / units available', 'Units available')

          # Final owner dashboard/menu fix. Capture clicks before older conflicting handlers.
          marker = '/* ===== FINAL OWNER DASHBOARD FIX 2026-08-23 ===== */'
          if marker not in s:
              fix = r'''
<script>
/* ===== FINAL OWNER DASHBOARD FIX 2026-08-23 ===== */
(function(){
  function installFinalOwnerFix(){
    const entry=document.getElementById('ownerEntry');
    if(entry && !entry.dataset.finalOwnerFix){
      entry.dataset.finalOwnerFix='1';
      entry.addEventListener('click',function(e){
        e.preventDefault();
        e.stopImmediatePropagation();
        document.getElementById('headerMenu')?.classList.add('hidden');
        ['welcomeHub','customer','retailCustomer','cateringCustomer','harnellCustomer','legalCustomer'].forEach(id=>document.getElementById(id)?.classList.add('hidden'));
        const owner=document.getElementById('owner');
        if(owner) owner.classList.remove('hidden');
        try{
          const u=new URL(location.href);
          u.search='';
          u.searchParams.set('view','owner');
          history.pushState({view:'owner'},'',u);
        }catch(_e){}
        try{
          if(typeof token!=='undefined' && token && typeof openOwner==='function') openOwner();
          else {
            document.getElementById('authPanel')?.classList.remove('hidden');
            document.getElementById('dashboard')?.classList.add('hidden');
          }
        }catch(_e){}
        window.scrollTo(0,0);
      },true);
    }

    const toggle=document.getElementById('ownerNavToggle');
    const menu=document.getElementById('ownerNavMenu');
    if(toggle && menu && !toggle.dataset.finalOwnerFix){
      toggle.dataset.finalOwnerFix='1';
      toggle.addEventListener('click',function(e){
        e.preventDefault();
        e.stopImmediatePropagation();
        menu.classList.toggle('hidden');
      },true);
    }

    if(menu){
      menu.querySelectorAll('button[data-area]').forEach(btn=>{
        if(btn.dataset.finalOwnerFix)return;
        btn.dataset.finalOwnerFix='1';
        btn.addEventListener('click',function(e){
          e.preventDefault();
          e.stopImmediatePropagation();
          menu.classList.add('hidden');
          if(typeof showOwnerArea==='function') showOwnerArea(btn.dataset.area);
        },true);
      });
    }
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',installFinalOwnerFix);
  else installFinalOwnerFix();
  setTimeout(installFinalOwnerFix,500);
})();
</script>
'''
              s = s.replace('</body>', fix + '\n</body>', 1)

          if s == original:
              print('No changes required')
          else:
              p.write_text(s, encoding='utf-8')
              print('index.html updated')
          PY

      - name: Commit the app update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "Fusion Flavours Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update Fusion at Home and fix Owner Dashboard"
          git push
