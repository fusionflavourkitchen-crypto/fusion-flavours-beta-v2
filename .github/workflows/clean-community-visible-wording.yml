name: Clean Community Meals visible wording
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-community-visible-wording.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale visible Harnell and resident wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          replacements={
            "['harnellorders','Harnell Orders']":"['harnellorders','Community Orders']",
            "harnell:[['harnell','Harnell']]":"harnell:[['harnell','Community Meals']]",
            "'Harnell House Menu'":"'Community Meals'",
            "'Simple, affordable meals for residents'":"'Affordable, filling meals for the community'",
            "🟢 Resident ordering open":"🟢 Community ordering open",
            "🔴 Resident ordering closed":"🔴 Community ordering closed",
            "Resident portion":"Community portion",
            "No Harnell dishes are available yet.":"No Community Meals dishes are available yet.",
            ">HARNELL</span>":">COMMUNITY</span>",
            ">Harnell House</h2>":">Community Meals</h2>",
            ">Resident service</span>":">Community service</span>",
            ">Resident service & payment</span>":">Community service & payment</span>",
            "Show Harnell House ordering":"Show Community Meals ordering",
            "Save Harnell settings":"Save Community Meals settings",
            ">Resident menu</span>":">Community menu</span>",
            ">Resident Dish List</span>":">Community Dish List</span>",
            "Resident price £":"Community price £",
            "Available to residents":"Available to community customers",
            "No Harnell dishes yet.":"No Community Meals dishes yet.",
            ">Resident orders</span>":">Community orders</span>",
            "No Harnell orders yet.":"No Community orders yet.",
            "Reuse a main menu dish, then give the Harnell version":"Reuse a main menu dish, then give the Community Meals version",
            "Changing it here only changes the Harnell menu":"Changing it here only changes the Community Meals menu",
            "Each Harnell dish has its own category.":"Each Community Meals dish has its own category.",
            "Harnell category":"Community category",
            "Harnell dish name":"Community dish name",
            "Harnell description":"Community description",
            "Add Harnell version":"Add Community version",
            "Save Harnell version":"Save Community version",
            "Place Harnell order":"Place Community Meals order",
            "Harnell ordering is currently closed.":"Community Meals ordering is currently closed.",
            "Harnell ordering is not currently accepting payment.":"Community Meals ordering is not currently accepting payment.",
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Verify visible wording cleanup
        run: |
          ! grep -q '>Harnell House<' index.html
          ! grep -q 'Harnell House Menu' index.html
          ! grep -q 'Resident ordering' index.html
          ! grep -q '>Resident service' index.html
          ! grep -q '>Resident menu' index.html
          ! grep -q '>Resident Dish List' index.html
          ! grep -q '>Resident orders' index.html
          ! grep -q 'Available to residents' index.html
          grep -q 'Community Meals' index.html
      - name: Commit
        run: |
          git config user.name "Fusion Flavours Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove stale resident wording from Community Meals UI"
          git pull --rebase origin main
          git push
