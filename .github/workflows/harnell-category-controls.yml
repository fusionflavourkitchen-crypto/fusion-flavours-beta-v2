name: Apply Harnell category controls

on:
  push:
    paths:
      - '.github/workflows/harnell-category-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Harnell category controls render immediately
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          marker='/* ===== v4.5 HARNELL CATEGORY INITIAL RENDER ===== */'
          if marker in text:
              print('Patch already present')
              raise SystemExit(0)
          patch=r'''
          <script>
          /* ===== v4.5 HARNELL CATEGORY INITIAL RENDER ===== */
          function ensureHarnellCategoryControls(){
            try{
              if(typeof injectHarnellCategoryControls==='function') injectHarnellCategoryControls();
            }catch(e){ console.warn('Harnell category controls:',e); }
          }
          if(document.readyState==='loading'){
            document.addEventListener('DOMContentLoaded',()=>setTimeout(ensureHarnellCategoryControls,0),{once:true});
          }else{
            setTimeout(ensureHarnellCategoryControls,0);
          }
          </script>
          '''
          if '</body>' not in text:
              raise SystemExit('Could not find </body>')
          text=text.replace('</body>',patch+'\n</body>',1)
          p.write_text(text)
          print('Patched index.html')
          PY
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ensure Harnell category controls render immediately"
          git push
