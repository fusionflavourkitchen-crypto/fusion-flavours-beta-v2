name: Apply Harnell category controls

on:
  push:
    paths:
      - '.github/workflows/harnell-category-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Harnell save fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          marker='/* ===== v4.4 FIX HARNELL SAVE FIELDS ===== */'
          if marker in text:
              print('Patch already present')
              raise SystemExit(0)
          patch=r'''
          <script>
          /* ===== v4.4 FIX HARNELL SAVE FIELDS ===== */
          window.saveHarnellDish=async id=>{
            try{
              const row=(ownerData.harnellMenu||[]).find(x=>Number(x.id)===Number(id));
              const cat=$('har_cat_'+id)?.value||harnellCategoryFromSort(row);
              await api('/rest/v1/harnell_menu_items?id=eq.'+id,{
                method:'PATCH',
                headers:{Prefer:'return=minimal'},
                body:JSON.stringify({
                  resident_price_pence:Math.round(Number($('har_price_'+id).value||0)*100),
                  active:$('har_active_'+id).checked,
                  sort_order:harnellEncodedSort(row,cat),
                  variant_name:($('har_variant_name_'+id)?.value||'').trim()||null,
                  variant_description:($('har_variant_desc_'+id)?.value||'').trim()||null,
                  portion_multiplier:Math.max(.5,Math.min(1.5,Number($('har_multiplier_'+id)?.value||1))),
                  updated_at:new Date().toISOString()
                })
              });
              await loadHarnellOwnerData();renderHarnellAdmin();
              if(typeof showToast==='function')showToast();
            }catch(e){alert(e.message)}
          };
          </script>
          '''
          if '</body>' not in text:
              raise SystemExit('Could not find </body>')
          text=text.replace('</body>',patch+'\n</body>',1)
          p.write_text(text)
          print('Patched index.html')
          PY
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Preserve Harnell dish fields when saving category"
          git push
